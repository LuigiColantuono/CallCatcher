name: Build APK + module

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin packages explicitly. The action's default list includes the obsolete "tools"
          # package, which Google removed from the SDK repo; leaving it in makes sdkmanager fail.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The gradle-wrapper.jar binary isn't committed, so materialise the wrapper here.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # Same key every build, so each APK can update the installed system app in place.
      - name: Restore signing key
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_B64" ]; then
            echo "$DEV_KEYSTORE_B64" | base64 -d > ui/dev.keystore
            echo "Signing with the dev key from DEV_KEYSTORE_B64"
          else
            echo "::warning::DEV_KEYSTORE_B64 is not set: this APK is signed with a throwaway key and cannot update an installed CallCatcher."
          fi

      - name: Build debug APK
        run: ./gradlew :ui:assembleDebug --stacktrace

      # A privileged permission requested by the APK but missing from the allowlist can stop a
      # device that enforces the allowlist from booting. Fail here instead.
      - name: Check permissions against the privapp allowlist
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK=ui/build/outputs/apk/debug/ui-debug.apk
          "$AAPT2" dump permissions "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u > requested.txt
          sed -n 's/.*<permission name="\([^"]*\)".*/\1/p' module/privapp-permissions-com.callcatcher.xml | sort -u > allowlisted.txt
          sort -u module/non-privileged-permissions.txt > ordinary.txt

          if [ ! -s requested.txt ]; then
            echo "::error::Could not read the APK's permissions (aapt2 output format changed?)"; exit 1
          fi

          {
            echo "### Requested permissions"
            sed 's/^/- /' requested.txt
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while read -r p; do
            case "$p" in com.callcatcher.*) continue ;; esac
            if grep -qxF "$p" allowlisted.txt || grep -qxF "$p" ordinary.txt; then continue; fi
            echo "::error::$p is requested but is neither allowlisted (module/privapp-permissions-com.callcatcher.xml) nor listed as ordinary (module/non-privileged-permissions.txt). Classify it before shipping."
            fail=1
          done < requested.txt

          while read -r p; do
            grep -qxF "$p" requested.txt || echo "::warning::$p is allowlisted but not requested by the APK"
          done < allowlisted.txt

          exit $fail

      - name: Package APK and KernelSU/Magisk module
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK=ui/build/outputs/apk/debug/ui-debug.apk
          VERSION_NAME=$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          VERSION_CODE=$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          SHORT_SHA=${GITHUB_SHA::7}

          mkdir -p dist
          cp "$APK" "dist/CallCatcher-${VERSION_NAME}-${SHORT_SHA}.apk"

          STAGE=build-module
          rm -rf "$STAGE"
          mkdir -p "$STAGE/system/priv-app/com.callcatcher" "$STAGE/system/etc/permissions"
          cp "$APK" "$STAGE/system/priv-app/com.callcatcher/com.callcatcher.apk"
          cp module/privapp-permissions-com.callcatcher.xml "$STAGE/system/etc/permissions/"
          cp module/customize.sh module/banner.png "$STAGE/"
          cp -r module/META-INF "$STAGE/"
          cat > "$STAGE/module.prop" <<EOF
          id=callcatcher
          name=CallCatcher
          version=v${VERSION_NAME}
          versionCode=${VERSION_CODE}
          author=Luigi Colantuono
          description=Phone & WhatsApp call recorder with a built-in player. Installs CallCatcher as a privileged system app.
          banner=banner.png
          EOF
          sed -i 's/^[[:space:]]*//' "$STAGE/module.prop"
          (cd "$STAGE" && zip -r9 "../dist/CallCatcher-module-${VERSION_NAME}-${SHORT_SHA}.zip" .)
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CallCatcher-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
